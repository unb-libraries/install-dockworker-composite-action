name: 'Install Dockworker'
description: 'Installs PHP, composer, and installs Dockworker from composer.json'
inputs:
  php-version:
    description: 'PHP version to install via shivammathur/setup-php. Defaults to 8.1 for backward compatibility.'
    required: false
    default: '8.1'
  composer-version:
    description: 'Composer tools version pin for shivammathur/setup-php. Defaults to 2.8.4 for backward compatibility.'
    required: false
    default: '2.8.4'
runs:
  using: "composite"
  steps:
    -
      name: Install PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php-version }}
        coverage: none
        tools: composer:${{ inputs.composer-version }}
        extensions: curl,dom,gd,mbstring,posix,snmp,yaml,zip
    -
      name: Pull Required Docker Images
      run: docker compose pull --parallel --quiet
      shell: bash
    -
      name: Install dockworker
      run: composer install --prefer-dist --no-progress --no-suggest --ignore-platform-reqs
      shell: bash
